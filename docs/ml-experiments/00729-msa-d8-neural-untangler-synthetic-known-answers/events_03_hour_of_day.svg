le-subtitle" font-size="11" transform="translate(6 35)"><tspan>Running means output of at least 15% of the engine&apos;s own reference output, the 99th percentile</tspan><tspan x="0" dy="13">of its running output. Shares are rounded to 5%, and a real hour with 1 to 4 running half-hours</tspan><tspan x="0" dy="13">is left blank (a gap in the real line). Saturday and Sunday are the weekend; the simulated</tspan><tspan x="0" dy="13">draws take bank holidays as weekdays and use the UK clock offset.</tspan></text></g></g></svg>
