nals and the experiment 637 detector, by depth and length of the injected shift.'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)"><tspan>Recall and delay of the H1 and E2 depth signals and the experiment 637 detector,</tspan><tspan x="0" dy="20">by depth and length of the injected shift.</tspan></text><text aria-label="Subtitle text 'Depth signal: alarm when |d| &gt;= 0.05 of capacity at leads 24 to 26 h. H1 and E2: mean over five seeds; experiment 637 has no seeds. False alarms per Primary-month on event-free origins: H1 1.66, E2 2.52. Experiment 637 flags 2.4% of all Primary-days (real events included). Lower panel: cells where every event was detected in a month; the 30-day cells are left out, because forecasts start at the month start, which inflates the delay.'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 55)"><tspan>Depth signal: alarm when |d| &gt;= 0.05 of capacity at leads 24 to 26 h.</tspan><tspan x="0" dy="13">H1 and E2: mean over five seeds; experiment 637 has no seeds.</tspan><tspan x="0" dy="13">False alarms per Primary-month on event-free origins: H1 1.66, E2 2.52. Experiment 637 flags 2.4% of all Primary-days (real events included).</tspan><tspan x="0" dy="13">Lower panel: cells where every event was detected in a month; the 30-day cells are left out,</tspan><tspan x="0" dy="13">because forecasts start at the month start, which inflates the delay.</tspan></text></g></g></svg>
