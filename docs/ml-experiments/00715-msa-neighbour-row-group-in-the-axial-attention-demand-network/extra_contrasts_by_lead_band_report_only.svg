port-only: F4 minus M* and F4 minus F4-R by lead band'" aria-roledescription="title" class="mark-text role-title-text" font-size="18" transform="translate(6 19)">Report-only: F4 minus M* and F4 minus F4-R by lead band</text><text aria-label="Subtitle text 'CRPS difference in points of capacity; below zero means F4 forecasts better. Dot: difference. Line: 98.75% interval (the headline's level) from resampling whole months. Dashed line: no difference. Over 8 folds and 2 seeds. Report-only, not a counted contrast: only the 24-240 h row is the headline. F4: neural network with neighbour rows. M*: the baseline of experiment 713, without neighbour rows. F4-R: F4 with its neighbours rewired to other Primaries (a placebo).'" aria-roledescription="subtitle" class="mark-text role-title-subtitle" font-size="11" transform="translate(6 35)"><tspan>CRPS difference in points of capacity; below zero means F4 forecasts better.</tspan><tspan x="0" dy="13">Dot: difference. Line: 98.75% interval (the headline&apos;s level) from resampling whole months.</tspan><tspan x="0" dy="13">Dashed line: no difference. Over 8 folds and 2 seeds.</tspan><tspan x="0" dy="13">Report-only, not a counted contrast: only the 24-240 h row is the headline.</tspan><tspan x="0" dy="13">F4: neural network with neighbour rows.</tspan><tspan x="0" dy="13">M*: the baseline of experiment 713, without neighbour rows.</tspan><tspan x="0" dy="13">F4-R: F4 with its neighbours rewired to other Primaries (a placebo).</tspan></text></g></g></svg>
