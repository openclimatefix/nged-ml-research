[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
# Triton's kernel decorators and `torch.autograd.Function`'s context object are not typed in a way
# `ty` can follow, so the kernel file is checked for the other rules only.
include = ["src/studies/battery_recurrence.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
invalid-method-override = "ignore"

[tool.ty.rules]
# With the `gpu` dependency group installed, `torch` resolves, so `ty` reports every
# `# ty: ignore[unresolved-import]` on a `torch` import as unused and every `nn.Module.forward`
# override as an `invalid-mutable-override`. CI does not install the group, so neither rule can
# fire there. Both are off so that `ty check` passes with and without the group.
unused-ignore-comment = "ignore"
invalid-mutable-override = "ignore"

[tool.ty.src]
# The era-fold measurement scripts are a record, not maintained code (see the ruff exclude).
exclude = ["studies/era_fold_design/scripts"]

[tool.pytest.ini_options]
# importlib mode lets test modules in different directories share a basename; the default
# prepend mode aborts collection with an "import file mismatch" error on a duplicate name.
# A full-suite run adds `-n auto` (pytest-xdist) itself, via the `tests/_pytest_autoinject.py`
# plugin loaded below; see that module's docstring for why it is not a plain `addopts` entry.
addopts = "--import-mode=importlib -p _pytest_autoinject"
# Pytest's default patterns.
python_files = ["test_*.py", "*_test.py"]
# Put the root `tests/` dir on sys.path so its integration tests can import shared, non-fixture
# test data (e.g. `_nwp_test_data`) by bare name — importlib mode does not add each test file's
# own directory to sys.path the way prepend mode does. This is also load-bearing for the `-p
# _pytest_autoinject` entry in `addopts` above: `-p` resolves a bare module name against sys.path,
# and `tests/_pytest_autoinject.py` is only importable as `_pytest_autoinject` because of this line.
#
# Each folder under `studies/` that holds a script a test imports by bare name is listed too, and in
# `extra-paths` under `[tool.ty.environment]` above. A script that imports another folder's
# script passes under this setting and fails under `uv run python studies/<folder>/<script>.py`
# unless the other folder is on `PYTHONPATH`. A test directory is listed when its
# tests import helpers from a sibling test module by bare name.
pythonpath = [
    "tests",
    "ml-experiments/00297-lsc-need-a-detector-no-detector-arms-against-the-mask",
    "scripts/mkdocs_hooks",
    "studies/beam_diffuse_split",
    "studies/embedded_battery_forecast",
    "studies/ens_backfill_pilot",
    "studies/lag_features",
    "studies/llm_capacity_labeller",
    "studies/nwp_forecast_comparison",
    "studies/open_meteo_ensemble_means",
    "studies/market_downloads",
    "studies/past_weather",
    "studies/quick_wins",
    "studies/solar_bmu_census",
    "studies/weather_downloads",
    "studies/wind_storage",
    "tests/studies/past_weather",
]
# `error` first: any warning not explicitly excepted below fails the test that raised it, so a
# deprecation in our own code is caught by the PR that introduces it instead of accumulating in the
# summary. Later entries win, so every exception below is applied on top of `error`.
#
# Each exception silences one *third-party* deprecation we cannot fix from this repo, and is pinned
# to the exact message and the exact upstream module that raises it, so it can never match a warning
# from our own code. Delete an entry when the upstream release named in its comment ships a fix.
# When a dependency upgrade adds a new upstream warning, the suite fails loudly: add an entry here,
# named and dated the same way, rather than widening an existing one.
filterwarnings = [
    "error",
    # mlflow 3.15.1: `utils/file_utils.py` and `utils/yaml_utils.py` (the only two call sites, and
    # both read and write) still use the `codecs.open()` that Python 3.14 deprecated. Triggered by
    # every file-store access, so most of the MLflow-backed tests hit it. Delete once MLflow
    # switches to the builtin `open()`.
    "ignore:codecs\\.open\\(\\) is deprecated:DeprecationWarning:mlflow\\.utils\\.(file_utils|yaml_utils)$",
]
# `.claude` holds git worktrees (`.claude/worktrees/*`), each a full checkout carrying its own
# copy of this `conftest.py`; recursing into them re-registers the `--run-studies` option and
# aborts collection with "option names {'--run-studies'} already added".
norecursedirs = [".venv", "venv", ".git", ".claude", "__pycache__"]

[tool.pymarkdown]
# Line length: prose in docs/, the READMEs and the skill files is hard-wrapped at 100 characters.
# `strict` and `stern` default to off, so a line is only flagged when it could actually have been
# wrapped — an unbreakable token such as a long URL passes. Headings are exempt because an ATX
# heading is one line by construction and was never part of the wrapped-prose convention.
plugins.md013.enabled = true
plugins.md013.line_length = 100
plugins.md013.tables = false
plugins.md013.code_blocks = false
plugins.md013.headings = false
# Duplicate heading: only flag duplicates under the same parent heading, not across
# the whole file (e.g. "Usage" appearing under two different top-level sections).
plugins.md024.siblings_only = true
# Nested list indent: MkDocs' renderer (Python-Markdown, no sane-lists extension) only treats a
# sub-list as nested when it's indented a full 4 spaces; 2-space indent (a bare list's default)
# silently renders as a flat, unnested list instead. Match the renderer, not the default.
#
# Use PML101 ("anchored list indentation"), not the more common MD007 ("ul-indent"), to enforce
# this: MD007 hard-codes bullets nested under an *ordered* item to align with the parent's
# content column (3 spaces for a "1. " marker) and ignores its own `indent` setting for that
# case — but Python-Markdown still needs a full 4 spaces to nest there, so MD007's own preferred
# indent renders flat. It also never checks a numbered sublist's indentation at all. PML101
# anchors every level at (depth − 1) × indent regardless of parent marker width, which is exactly
# Python-Markdown's model, so it accepts 4-space nesting under both bullet and numbered parents
# with no pragmas — and catches under-indented numbered sublists that MD007 misses entirely.
plugins.md007.enabled = false
plugins.pml101.enabled = true
plugins.pml101.indent = 4
# Front matter: Claude Code skills (.claude/skills/*/SKILL.md) require a YAML frontmatter block.
# Without this, pymarkdown misreads the frontmatter as document content (e.g. "---" as a setext
# heading underline), producing spurious heading-style/blank-line errors.
extensions.front-matter.enabled = true
# Tables: MD013's `tables = false` above only exempts a pipe table's rows from the line-length
# check if pymarkdown recognises them as table tokens in the first place, which needs this
# extension. Without it, a table row is scanned as an ordinary paragraph line and MD013 flags
# every row wider than 100 characters, even though a wrapped table row would not render as a table.
extensions.markdown-tables.enabled = true
# Table column style: this extension turns MD060 on too, which wants every pipe table in the repo
# reformatted to its "compact" delimiter style — hundreds of pre-existing rows, out of #690's
# scope of line length alone.
plugins.md060.enabled = false
# Link fragments: pymarkdownlnt 0.9.40 (the first release to implement this rule) doesn't
# reproduce Python-Markdown's slug algorithm for a heading containing an em dash, so it flags
# every anchor link to a heading like "### 10 — Every write is atomic..." as broken even though
# the anchor is exactly what MkDocs generates and renders correctly — confirmed against
# scripts/lint/check_docs_links.py, which parses MkDocs' actual output and passes on the same links.
plugins.md051.enabled = false
# Emphasis style: pymarkdownlnt 0.9.40 also newly implements this rule, and it doesn't know that
# an underscore inside `$...$`/`$$...$$` math is a LaTeX subscript, not markdown emphasis — e.g.
# `\hat{q}_t(\tau_{\mathrm{lo}})` in docs/techniques/evaluation-metrics.md gets misread as an
# emphasis span and flagged. That's mixed in the same rule output with genuine underscore-vs-
# asterisk inconsistencies in prose, so the finding list can't be trusted without a per-instance
# check the math would make risky to automate. Revisit once upstream is math-aware.
plugins.md049.enabled = false
