          - Substation information fields: ml-experiments/background/substation-information-fields.md
          - Metered generators and anonymisation: ml-experiments/background/metered-generators-and-anonymisation.md
          - Market and other data: ml-experiments/background/market-and-other-data.md
          - Problems and the current best forecast: ml-experiments/background/problems-and-current-best-forecast.md
