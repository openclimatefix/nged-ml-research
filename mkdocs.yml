site_name: NGED ML research

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.copy

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/ocf.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - scripts/mkdocs_hooks/experiment_tables.py

plugins:
  - search
  - include-markdown
  # Keeps URLs that have been shared outside the docs working after a page is renamed.
  - redirects:
      redirect_maps:
        ml-experiments/research-log.md: ml-experiments/README.md
        ml-experiments/research-plan.md: ml-experiments/README.md
        ml-experiments/series/solar-disaggregation.md: ml-experiments/themes/solar-disaggregation/index.md
        ml-experiments/series/demand-inputs.md: ml-experiments/themes/demand-inputs/index.md
        ml-experiments/series/weather-products-and-blending.md: ml-experiments/themes/weather-products-and-blending/index.md
        ml-experiments/series/retraining-and-demand-reference.md: ml-experiments/themes/retraining-and-training-history/index.md
        studies/weather-products-for-the-past.md: studies/past-weather/solar.md
        studies/weather-products-for-past-solar.md: studies/past-weather/solar.md
        studies/weather-products-for-past-wind.md: studies/past-weather/wind.md
        studies/blending-weather-products.md: studies/past-weather/blending.md
        studies/ens-forecast-horizons.md: studies/forecasts/ens-horizons.md
        studies/nwp-forecasts-at-matched-leads.md: studies/forecasts/matched-lead.md

nav:
  - Home: index.md
  - Studies:
      - Overview: studies/index.md
      - "Does a weather product's beam/diffuse split help a PV forecast?": studies/beam-diffuse-split.md
      - "How much solar sits behind each Primary substation, and how far can the number be trusted?": studies/embedded-pv-capacity.md
      - "How many Balancing Mechanism Units in Great Britain are solar?": studies/solar-bmu-census.md
      - "Can solar be separated from an aggregate Balancing Mechanism Unit?": studies/solar-bmu-disaggregation.md
      - "Can solar be separated from a battery in an aggregate Balancing Mechanism Unit?": studies/battery-pv-separation.md
      - "How well can a primary substation's half-hourly flow reveal an unmetered battery?": studies/unmetered-battery-capacity.md
      - "How well can an embedded battery's output be forecast, and how many of NGED's batteries have a published plan?": studies/embedded-battery-forecast.md
      - "Do INDDEM and INDGEN line up with the GSP groups of NGED's licence areas?": studies/indgen-inddem-and-gsp-take.md
      - Past weather:
          - Overview: studies/past-weather/index.md
          - Methods shared by the past-weather studies: studies/past-weather/methods.md
          - "Which weather product best describes past sunshine?": studies/past-weather/solar.md
          - "Which weather product best describes past wind?": studies/past-weather/wind.md
          - "Do CERRA and NORA3 describe past wind better than ERA5?": studies/past-weather/reanalysis-wind.md
          - "Does blending CERRA's wind heights beat one height?": studies/past-weather/cerra-wind-levels.md
          - "Does CERRA's wind direction add to its wind speed?": studies/past-weather/cerra-wind-direction.md
          - "Which ERA5 variables help predict solar farm output?": studies/past-weather/era5-solar-variables.md
          - "Does blending weather products beat the best single weather product?": studies/past-weather/blending.md
          - "Does CEDA's UKV or ERA5 describe past wind and temperature better?": studies/past-weather/ukv-ceda-vs-era5.md
          - "Do CEDA's and Open-Meteo's archives of UKV give the same power forecasts?": studies/past-weather/ukv-ceda-vs-openmeteo.md
      - Forecasts:
          - "Wind component storage measurement": studies/forecasts/wind-storage.md
          - "How should we interpolate wind components?": studies/forecasts/wind-interpolation.md
          - "How accurate is a power forecast driven by ECMWF ENS at each horizon?": studies/forecasts/ens-horizons.md
          - "Do other weather forecasts beat ECMWF's ensemble at day-ahead lead?": studies/forecasts/matched-lead.md
          - "Extra weather products in the day-ahead lead comparison: how they are read, and their results": studies/forecasts/matched-lead-extra-products.md
          - "Which IFS forecast variables, or which second forecast, help a solar power forecast?": studies/forecasts/ifs-solar-variables.md
          - "Which single weather forecast should be added to ECMWF's ensemble mean first?": studies/forecasts/blends-with-ens.md
          - "Does adding UKV from CEDA to ECMWF's ensemble mean lower the error at lead days 1 to 4?": studies/forecasts/ukv-ceda-blends.md
          - "How do Open-Meteo's ensemble-mean products compare for solar and wind power?": studies/forecasts/ensemble-means.md
          - "Does a same-hour power lag improve a day-ahead solar forecast?": studies/forecasts/lag-features.md
          - "Is a daily capacity estimate worth building for day-ahead solar forecasts?": studies/forecasts/effective-capacity.md
          - "Which cheap changes lower the production XGBoost forecast's error?": studies/forecasts/quick-wins.md
          - "Production feature faults: diagnosis and forecast effects": studies/forecasts/production-feature-faults.md
          - "Can a language model label a solar plant's capacity changes?": studies/forecasts/llm-capacity-labeller.md
