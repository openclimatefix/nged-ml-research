name: Publish Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks/**'
  # Lets us re-deploy by hand from the Actions tab. GitHub drops queued events during an Actions
  # outage and never backfills them, so a merge that lands mid-outage silently never publishes.
  workflow_dispatch:

# This permission is required so the action can push the built HTML to the gh-pages branch
permissions:
  contents: write

env:
  NGED_S3_BUCKET_URL: "https://example.com"
  NGED_S3_BUCKET_ACCESS_KEY: "dummy"
  NGED_S3_BUCKET_SECRET: "dummy"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Build and deploy to GitHub Pages
        run: uv run --no-sync mkdocs gh-deploy --force
